<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Laser Deposition Minigame</title>
<link rel="stylesheet" href="mg-core.css">
<link rel="stylesheet" href="mg-proc.css">
<style>html,body{margin:0;height:100%;background:#0a0c0e;overscroll-behavior:none;}</style>
</head>
<body>
<div id="mg"></div>
<script src="mg-core.js"></script>
<script src="mg-3d.js"></script>
<script src="mg-proc.js"></script>
<script src="mg-synth.js"></script>
<script>
// Laser Deposition — a directed-energy-deposition cell: an enclosure with
// a glazed front door, a laser head coming down from the roof with a
// coaxial powder nozzle, and a build plate on the table below.
//
// Open the door, take off the powder nozzle and then the head, lift out
// the build plate; vacuum the powder out of the enclosure; clean the
// door glass, the nozzle, the head's protective window and the plate;
// empty the used powder from the catch hopper into the waste drum; and
// put it all back.
(function(){
  "use strict";
  const { mat, build } = M3;
  const B = build;

  const PANEL = [96, 104, 118], FRAME = [62, 66, 76], CU = [200, 124, 80], HEAD = [150, 154, 164];
  const TRAY = [6, 0, 0];
  const DRUM = [12, 0, 0];                     // waste drum, out of the way

  // ---- enclosure (fixed) ----
  // Inside: x -0.7..0.7, y -0.6..0.5, z -0.45..0.45; the front is open
  // behind the door.
  const scenery = [
    B.at(B.box(40, 5, 0.1, [56, 62, 72]), mat.tr(4, 1, -2)),
    B.at(B.box(40, 0.1, 8, [70, 64, 58]), mat.tr(4, -1.05, 0)),
    B.at(B.box(1.5, 0.4, 1.0, [80, 84, 92]), mat.tr(0, -0.82, 0)),             // plinth
    B.at(B.box(1.5, 0.05, 1.0, PANEL), mat.tr(0, -0.625, 0)),                  // floor
    B.at(B.box(1.5, 1.15, 0.05, PANEL), mat.tr(0, -0.05, -0.475)),             // back
    B.at(B.box(0.05, 1.15, 1.0, PANEL), mat.tr(-0.725, -0.05, 0)),             // left
    B.at(B.box(0.05, 1.15, 1.0, PANEL), mat.tr(0.725, -0.05, 0)),              // right
    B.at(B.box(1.5, 0.05, 1.0, PANEL), mat.tr(0, 0.525, 0)),                   // roof
    B.at(B.box(0.4, 0.25, 0.4, FRAME), mat.tr(0, 0.67, 0)),                    // head carriage on the roof
    B.at(B.box(0.7, 0.12, 0.6, [70, 74, 84]), mat.tr(0, -0.54, 0)),            // XY table
    // Powder hopper on the right side of the roof, feeding the head.
    B.at(B.upright(B.lathe([[0, 0.05], [0.2, 0.14], [0.35, 0.14]], 24, { c: HEAD })), mat.tr(0.45, 0.55, 0.1)),
    // Parts table and the waste drum's corner.
    B.at(B.box(2.4, 0.08, 1.4, [120, 98, 72]), mat.tr(TRAY[0], -0.44, 0)),
    B.at(B.box(2.6, 0.08, 1.4, [120, 98, 72]), mat.tr(DRUM[0] - 0.3, -0.44, 0)),
    B.at(B.upright(B.lathe([[0, 0.3], [0.6, 0.3]], 32, { c: [64, 88, 140] })), mat.tr(DRUM[0] + 0.2, -0.4, 0)),
    B.at(B.upright(B.lathe([[0, 0.31], [0.04, 0.31]], 32, { c: [40, 48, 60] }, true)), mat.tr(DRUM[0] + 0.2, 0.18, 0)),
  ];

  // ---- parts ----
  function door() {
    const glass = B.box(1.2, 0.85, 0.02, [150, 200, 220]);
    glass.f.forEach(f => { f.a = 0.25; f.glass = true; });
    return B.merge([
      B.box(1.45, 0.1, 0.05, FRAME), B.at(B.box(1.45, 0.1, 0.05, FRAME), mat.tr(0, -1.05, 0)),
      B.at(B.box(0.1, 1.15, 0.05, FRAME), mat.tr(-0.675, -0.525, 0)), B.at(B.box(0.1, 1.15, 0.05, FRAME), mat.tr(0.675, -0.525, 0)),
      B.at(glass, mat.tr(0, -0.525, 0)),
      B.at(B.box(0.06, 0.3, 0.06, [40, 40, 44]), mat.tr(0.5, -0.5, 0.05)),    // handle
    ]);
  }
  function head() {
    return B.merge([
      B.cylinder(0.1, 0.42, 24, HEAD),
      B.at(B.cylinder(0.12, 0.05, 24, FRAME), mat.tr(0, 0.0, 0)),
      // Protective window at the bottom, facing down.
      B.at(B.blob(new Array(16).fill(0.075), [60, 90, 110]), mat.chain(mat.tr(0, -0.001, 0), mat.rx(Math.PI / 2))),
    ]);
  }
  function nozzle() {
    const m = B.upright(B.lathe([[0, 0.022], [0.12, 0.07], [0.15, 0.08]], 24, { c: CU }, true));
    m.ds = true;
    return m;
  }
  function plate() {
    return B.box(0.6, 0.05, 0.5, [160, 166, 174]);
  }

  const parts = [
    { id:'door', name:'扉', mesh: door(), at: mat.tr(0, 0.475, 0.5),
      // Laid flat, inner face up.
      tray: mat.chain(mat.tr(TRAY[0] - 0.3, -0.39, 0.0), mat.rx(Math.PI / 2), mat.tr(0, 0.525, 0)) },
    { id:'nozzle', name:'粉末ノズル', mesh: nozzle(), at: mat.tr(0, -0.07, 0), needs: ['door'],
      tray: mat.chain(mat.tr(TRAY[0] + 0.95, -0.32, 0.45), mat.rz(Math.PI / 2)) },
    { id:'head', name:'レーザーヘッド', mesh: head(), at: mat.tr(0, 0.08, 0), needs: ['door', 'nozzle'],
      tray: mat.chain(mat.tr(TRAY[0] + 0.85, 0.02, -0.25), mat.rx(Math.PI)) },
    { id:'plate', name:'造形ステージ', mesh: plate(), at: mat.tr(0, -0.455, 0), needs: ['door'],
      tray: mat.tr(TRAY[0] + 0.1, -0.375, 0.45) },
  ];

  // ---- stains ----
  const powder = () => { const v = 100 + Math.random() * 30; return [v, v, v + 6]; };
  const dirt = [
    // Spilt powder on the floor and the table edge, soot up the back wall.
    ...[[-0.5, 0.25], [0.5, 0.3], [-0.45, -0.3], [0.45, -0.25]].map(([x, z]) =>
      ({ p: [x, -0.6, z], n: [0, 1, 0], r: 0.07, c: powder() })),
    { p: [-0.3, 0.15, -0.449], n: [0, 0, 1], r: 0.08, c: [70, 66, 62] },
    { p: [0.25, 0.25, -0.449], n: [0, 0, 1], r: 0.07, c: [70, 66, 62] },
    // Fume on the inside of the door glass (it lies glass-up on the table).
    { part: 'door', p: [0.15, -0.5, -0.012], n: [0, 0, -1], r: 0.1, c: [120, 116, 104] },
    // Powder caked in the nozzle and on the head's window.
    { part: 'nozzle', p: [0.0, 0.05, 0.043], n: [0, -0.4, 1], r: 0.03, c: powder() },
    { part: 'head', p: [0.0, -0.002, 0.0], n: [0, -1, 0], r: 0.05, c: [140, 136, 120] },
    // Spatter on the build plate.
    { part: 'plate', p: [0.1, 0.026, 0.05], n: [0, 1, 0], r: 0.05, c: [80, 78, 84] },
    { part: 'plate', p: [-0.15, 0.026, -0.1], n: [0, 1, 0], r: 0.05, c: [80, 78, 84] },
  ];

  // ---- special: empty the catch hopper into the waste drum ----
  // Hold to tilt it. Powder only runs past about 35°; past 70° it all goes
  // at once and puffs up out of the drum, so ease it.
  let P;
  const POUR = [35, 70];
  const special = {
    name: '粉の廃棄',
    reset() { P = { tilt: 0, holding: false, left: 1, puff: 0, stream: [], cloud: [], doneT: 0 }; },
    start(api) {
      special.reset();
      api.setView({ target: [DRUM[0] - 0.2, 0.15, 0], dist: 2.2, height: 0.5, fov: 38, fixAz: 0.3 });
      api.panel(`<div class="pc-gauge"><span class="k">傾き</span>
        <div class="pc-meter"><div class="pc-win" id="tw"></div><div class="pc-fill danger" id="tF"></div></div></div>
        <div class="pc-gauge"><span class="k">残り</span>
        <div class="pc-meter"><div class="pc-fill" id="lF"></div></div></div>`);
      api.$('tw').style.left = (POUR[0] / 90 * 100) + '%';
      api.$('tw').style.width = ((POUR[1] - POUR[0]) / 90 * 100) + '%';
      api.buttons(`<button class="pc-btn act sy-sp" id="tilt">傾ける（長押し）</button>`);
      MG.hold(api.$('tilt'), () => { P.holding = true; }, () => { P.holding = false; });
      // Automated tests: keep the tilt in the pouring window.
      window.__special = () => { P.holding = P.tilt < 55; };
    },
    tick(dt, api) {
      if (P.left <= 0) { P.doneT += dt; P.holding = false; }
      P.tilt = Math.max(0, Math.min(90, P.tilt + (P.holding ? 45 : -30) * dt));
      P.puff = Math.max(0, P.puff - dt);
      if (P.tilt > POUR[0] && P.left > 0) {
        const rate = P.tilt > POUR[1] ? 0.15 : 0.08 + 0.18 * (P.tilt - POUR[0]) / (POUR[1] - POUR[0]);
        P.left = Math.max(0, P.left - rate * dt * 1.6);
        if (P.left === 0) api.flash('粉を捨て終えた！', '#5fd38a');
        for (let i = 0; i < 4; i++) P.stream.push({ t: 0, x: Math.random() * 6 - 3 });
        if (P.tilt > POUR[1] && P.puff === 0) {
          P.puff = 1.2;
          api.flash('粉が舞い上がった！ゆっくり傾けよう', '#e2603f');
          for (let i = 0; i < 40; i++) P.cloud.push({ t: 0, a: Math.random() * Math.PI * 2, v: 20 + Math.random() * 40 });
        }
      }
      P.stream = P.stream.filter(s => (s.t += dt) < 0.5);
      P.cloud = P.cloud.filter(c => (c.t += dt) < 1.4);
      const tF = api.$('tF'), lF = api.$('lF');
      if (tF) {
        tF.style.width = (P.tilt / 90 * 100).toFixed(1) + '%';
        tF.style.backgroundColor = P.tilt > POUR[1] ? '#ff5a3a' : P.tilt >= POUR[0] ? '#5fd38a' : '#e8b84a';
        lF.style.width = (P.left * 100).toFixed(1) + '%';
      }
    },
    done() { return P.doneT > 0.6; },
    status() { return `残りの粉 ${Math.round(P.left * 100)}%`; },
    tip(api) {
      if (P.left <= 0) return null;
      return [api.$('tilt'), P.tilt > POUR[1] ? '傾けすぎ！指を離そう' : '緑の範囲で傾けて粉を捨てよう！'];
    },
    meshes() {
      // The hopper, held over the drum's rim and tipped about its lip.
      const a = P.tilt * Math.PI / 180;
      const hopper = B.merge([
        B.box(0.4, 0.3, 0.3, HEAD),
        B.at(B.box(0.36, 0.02, 0.26, [110 + 40 * P.left, 110 + 40 * P.left, 116 + 40 * P.left]), mat.tr(0, 0.14 * P.left, 0)),
      ]);
      hopper.m = mat.chain(mat.tr(DRUM[0] - 0.25, 0.42, 0), mat.rz(-a), mat.tr(0.2, 0, 0));
      return [hopper];
    },
    overlay(g, api) {
      const q = api.r3.project([DRUM[0] - 0.05, 0.42, 0]);
      if (!q) return;
      for (const s of P.stream) {
        g.fillStyle = `rgba(170,170,176,${(1 - s.t / 0.5).toFixed(2)})`;
        g.fillRect(q[0] + 4 + s.x + s.t * 20, q[1] + s.t * 160, 2, 3);
      }
      const d = api.r3.project([DRUM[0] + 0.2, 0.25, 0]);
      for (const c of P.cloud) {
        const r = c.v * c.t;
        g.fillStyle = `rgba(200,200,205,${(0.5 * (1 - c.t / 1.4)).toFixed(2)})`;
        g.beginPath(); g.arc(d[0] + Math.cos(c.a) * r, d[1] - Math.abs(Math.sin(c.a)) * r - c.t * 30, 3 + c.t * 8, 0, Math.PI * 2); g.fill();
      }
    },
  };

  MG.mount(document.getElementById('mg'), {
    id: 'laser',
    title: 'LASER DEPOSITION',
    subtitle: 'Cell Cleaning',
    desc: 'レーザー造形装置を分解して、チャンバー内の粉を掃除し、扉・ノズル・ヘッド・ステージを清掃。使用済みの粉を廃棄してから組み立てる。',
    goal: 1,
    build: MGSynth.build({
      hud: 'DED cell',
      view: { target: [0, -0.1, 0], dist: 3.0, height: 1.2, fov: 40, az: 0.35 },
      tray: { target: [TRAY[0], -0.3, 0.1], dist: 2.5, height: 2.0, fov: 38 },
      scenery, parts, dirt, special,
    }),
  });
})();
</script>
</body>
</html>
