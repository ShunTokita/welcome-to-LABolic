<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SEM TUNER — proto</title>
<style>
  :root{
    --bg:#0a0c0e;
    --panel:#13171b;
    --panel-2:#1b2127;
    --line:#283038;
    --amber:#ffb000;
    --amber-dim:#9a6a00;
    --steel:#7fa8c9;
    --txt:#c7d0d8;
    --txt-dim:#6c7884;
    --good:#5fd38a;
    --bad:#e2603f;
    --mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
    /* SEM console panel (neutral instrument gray) */
    --con-bg:#41464b;
    --con-bg2:#363b40;
    --con-line:#5a6166;
    --con-line2:#22262a;
    --con-txt:#cdd2d6;
    --con-txt-dim:#8a9197;
    --con-font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Chakra Petch", system-ui, sans-serif;
    overscroll-behavior:none; touch-action:manipulation;}
  body{display:flex;justify-content:center;}
  .app{width:100%;max-width:460px;min-height:100%;display:flex;flex-direction:column;
    padding:10px 12px 16px;gap:10px;}

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:stretch;gap:10px;}
  .capture{flex:1;border:1px solid var(--amber-dim);background:linear-gradient(180deg,#241a05,#160f02);
    color:var(--amber);font-family:var(--mono);font-weight:700;letter-spacing:.18em;
    font-size:18px;border-radius:6px;padding:14px 0;text-transform:uppercase;
    transition:transform .05s, background .1s, box-shadow .1s;}
  .capture:active{transform:scale(.985);background:linear-gradient(180deg,#3a2a08,#241804);
    box-shadow:0 0 0 1px var(--amber) inset, 0 0 18px -4px var(--amber);}
  .capture:disabled{opacity:.4;color:var(--txt-dim);border-color:var(--line);}
  .readout{width:130px;border:1px solid var(--line);background:var(--panel);border-radius:6px;
    display:flex;flex-direction:column;justify-content:center;padding:6px 10px;font-family:var(--mono);}
  .readout .k{font-size:9px;letter-spacing:.14em;color:var(--txt-dim);text-transform:uppercase;}
  .readout .v{font-size:20px;line-height:1.05;color:var(--amber);font-weight:700;}
  .readout .v.time{color:var(--steel);}
  .readout .v.time.warn{color:var(--bad);}

  /* ---- viewport ---- */
  .stage{position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--line);
    border-radius:6px;overflow:hidden;background:#000;}
  .stage svg{display:block;width:100%;height:100%;}
  .hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:10px;
    color:rgba(199,208,216,.55);letter-spacing:.08em;}
  .hud .tl{position:absolute;top:8px;left:10px;}
  .hud .tr{position:absolute;top:8px;right:10px;text-align:right;}
  .hud .bl{position:absolute;bottom:8px;left:10px;}
  .hud .br{position:absolute;bottom:8px;right:10px;text-align:right;}
  .scanlines{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.25;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);}
  .wobbtag{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--bad);
    border:1px solid var(--bad);padding:2px 8px;border-radius:3px;display:none;}
  .wobbtag.on{display:block;}

  /* rhythm-game judgment popup */
  .judge{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(.4);
    font-family:var(--con-font);font-style:italic;font-weight:800;font-size:42px;
    letter-spacing:.01em;pointer-events:none;opacity:0;white-space:nowrap;z-index:3;
    text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .judge.play{animation:judgePop .9s cubic-bezier(.2,.9,.25,1) forwards;}
  @keyframes judgePop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-6deg);}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(-2deg);}
    28%{transform:translate(-50%,-50%) scale(1.0) rotate(0deg);}
    72%{opacity:1;transform:translate(-50%,-58%) scale(1.0);}
    100%{opacity:0;transform:translate(-50%,-74%) scale(1.02);}
  }

  /* ---- quality bar (live) ---- */
  .qwrap{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;color:var(--txt-dim);}
  .qbar{flex:1;height:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0d1115;}
  .qfill{height:100%;width:0%;background:linear-gradient(90deg,#5a2a1a,#caa23a,#5fd38a);transition:width .08s linear;}
  .qmark{width:1px;height:8px;background:var(--txt-dim);}

  /* ---- console ---- */
  .console{background:linear-gradient(180deg,var(--con-bg),var(--con-bg2));
    border:1px solid var(--con-line2);border-radius:6px;padding:12px 12px 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    font-family:var(--con-font);
    display:flex;flex-direction:column;gap:14px;}
  .console .lab,.console .val,.console .side,.console .toggle,.console .btn-ghost{font-family:var(--con-font);}
  .row{display:flex;align-items:center;gap:12px;}
  .row .lab{width:74px;font-size:11px;letter-spacing:.04em;font-weight:700;
    color:var(--con-txt);text-transform:uppercase;}
  .row .val{width:42px;text-align:right;font-size:12px;color:#dfe4e8;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--con-line2);border-radius:2px;
    border:1px solid #14181b;}
  input[type=range]::-moz-range-track{height:3px;background:var(--con-line2);border-radius:2px;border:1px solid #14181b;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%, #f4f7fa, #8a99a6 60%, #4a565f);
    border:1px solid #0a0c0e;box-shadow:0 1px 3px rgba(0,0,0,.6);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f4f7fa, #8a99a6 60%, #4a565f);border:1px solid #0a0c0e;}

  /* stigmator 2D pad */
  .stig{display:flex;gap:14px;align-items:stretch;}
  .pad{position:relative;width:104px;height:104px;border:1px solid var(--con-line2);border-radius:6px;
    background:radial-gradient(circle at center, #2c3033, #1d2123);flex:none;touch-action:none;
    box-shadow:inset 0 0 10px rgba(0,0,0,.45);}
  .pad .cross{position:absolute;background:#555c61;}
  .pad .cx{left:0;right:0;top:50%;height:1px;}
  .pad .cy{top:0;bottom:0;left:50%;width:1px;}
  .pad .dot{position:absolute;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--amber), #6a4700 70%);
    border:1px solid #0a0c0e;transform:translate(-50%,-50%);left:50%;top:50%;box-shadow:0 0 8px -2px var(--amber);}
  .stig .side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;
    font-size:11px;color:var(--con-txt-dim);letter-spacing:.02em;}
  .stig .side .lab{color:var(--con-txt);text-transform:uppercase;font-weight:700;}
  .stig .side .v{color:#dfe4e8;font-size:12px;}
  .hd-only{display:none;}
  .hd-active .hd-only{display:flex;}
  .pad .dot.align{background:radial-gradient(circle at 35% 30%, #bcd6ec, #4f7a9c 70%);
    box-shadow:0 0 8px -2px var(--steel);}

  .footer{display:flex;align-items:center;gap:10px;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
    letter-spacing:.06em;color:var(--con-txt);text-transform:uppercase;cursor:pointer;
    border:1px solid var(--con-line);border-radius:5px;padding:8px 12px;
    background:linear-gradient(180deg,#4a4f54,#3a3f44);}
  .toggle .led{width:9px;height:9px;border-radius:50%;background:#2a3035;box-shadow:inset 0 0 2px #000;}
  .toggle.on{color:var(--bad);border-color:var(--bad);}
  .toggle.on .led{background:var(--bad);box-shadow:0 0 8px -1px var(--bad);}
  .btn-ghost{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;
    color:var(--con-txt);text-transform:uppercase;border:1px solid var(--con-line);border-radius:5px;
    padding:8px 12px;background:linear-gradient(180deg,#4a4f54,#3a3f44);}

  /* ---- overlay ---- */
  .overlay{position:fixed;inset:0;background:rgba(5,7,9,.92);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;z-index:10;padding:24px;text-align:center;}
  .overlay.on{display:flex;}
  .overlay h1{font-family:var(--mono);color:var(--amber);letter-spacing:.2em;font-size:22px;margin:0;}
  .overlay .big{font-family:var(--mono);font-size:54px;color:var(--steel);font-weight:700;margin:0;}
  .overlay p{color:var(--txt-dim);font-family:var(--mono);font-size:12px;max-width:300px;line-height:1.6;margin:0;}
  .overlay button{font-family:var(--mono);letter-spacing:.18em;color:var(--amber);
    border:1px solid var(--amber-dim);background:linear-gradient(180deg,#241a05,#160f02);
    border-radius:6px;padding:14px 30px;font-size:14px;text-transform:uppercase;}
  .modesel{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
  .overlay .modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
    font-family:var(--mono);text-transform:none;letter-spacing:.02em;text-align:left;
    color:var(--txt-dim);border:1px solid var(--line);background:var(--panel);
    border-radius:6px;padding:12px 14px;cursor:pointer;width:100%;transition:border-color .12s,color .12s,background .12s;}
  .overlay .modebtn .mt{font-size:14px;font-weight:700;letter-spacing:.12em;}
  .overlay .modebtn .md{font-size:10px;color:var(--txt-dim);letter-spacing:.04em;}
  .overlay .modebtn.sel{color:var(--amber);border-color:var(--amber-dim);
    background:linear-gradient(180deg,#1c1606,#120d03);box-shadow:0 0 0 1px var(--amber-dim) inset;}
  .overlay .modebtn.sel .md{color:var(--steel);}
  .flash{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);
    font-size:13px;padding:8px 16px;border-radius:5px;letter-spacing:.08em;z-index:20;
    opacity:0;transition:opacity .15s;pointer-events:none;}
  .flash.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="capture" id="captureBtn">Capture!</button>
    <div class="readout">
      <span class="k">Score</span><span class="v" id="scoreV">0</span>
    </div>
    <div class="readout">
      <span class="k" id="rk2">Time</span><span class="v time" id="timeV">30.0</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <svg viewBox="0 0 300 300" id="svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="psf" x="-40%" y="-40%" width="180%" height="180%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="linearRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0 0" id="blur" result="b"/>
          <feComponentTransfer in="b" result="tone">
            <feFuncR type="linear" slope="1" intercept="0" id="fR"/>
            <feFuncG type="linear" slope="1" intercept="0" id="fG"/>
            <feFuncB type="linear" slope="1" intercept="0" id="fB"/>
          </feComponentTransfer>
        </filter>
        <radialGradient id="vig" cx="50%" cy="50%" r="62%">
          <stop offset="70%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="1"/>
        </radialGradient>
        <clipPath id="frame"><rect x="0" y="0" width="300" height="300"/></clipPath>
      </defs>

      <g clip-path="url(#frame)">
        <!-- A: +theta frame ; filter applied here -> blur axes follow theta -->
        <g id="rotA">
          <g filter="url(#psf)">
            <!-- C: -theta -> content upright in world -->
            <g id="rotC">
              <g id="scene"><!-- drawn by JS, 1.6x oversized & centered --></g>
            </g>
          </g>
        </g>
        <rect x="0" y="0" width="300" height="300" fill="url(#vig)"/>
      </g>
    </svg>
    <div class="scanlines"></div>
    <div class="wobbtag" id="wobbtag">WOBB</div>
    <div class="judge" id="judge"></div>
    <div class="hud">
      <div class="tl">SEI&nbsp;&nbsp;15.0kV</div>
      <div class="tr" id="hudGlyph">— — —</div>
      <div class="bl">WD&nbsp;10.0mm</div>
      <div class="br">x25,000</div>
    </div>
  </div>

  <div class="qwrap" id="qwrap">
    <span>IMG&nbsp;QUALITY</span>
    <div class="qbar"><div class="qfill" id="qfill"></div></div>
    <span id="qpct">0%</span>
  </div>

  <div class="console">
    <div class="row">
      <span class="lab">Focus</span>
      <input type="range" id="focus" min="-100" max="100" value="0" step="1">
      <span class="val" id="focusV">0</span>
    </div>

    <div class="stig">
      <div class="pad" id="pad">
        <div class="cross cx"></div><div class="cross cy"></div>
        <div class="dot" id="padDot"></div>
      </div>
      <div class="side">
        <div class="lab">Stigmator</div>
        <div>X&nbsp;<span class="v" id="stigXV">0</span></div>
        <div>Y&nbsp;<span class="v" id="stigYV">0</span></div>
        <div style="color:#48535d;margin-top:4px;line-height:1.4">drag pad to<br>correct astig.</div>
      </div>
    </div>

    <div class="row">
      <span class="lab">Contrast</span>
      <input type="range" id="contrast" min="20" max="320" value="100" step="1">
      <span class="val" id="contrastV">1.00</span>
    </div>
    <div class="row">
      <span class="lab">Bright</span>
      <input type="range" id="bright" min="-100" max="100" value="0" step="1">
      <span class="val" id="brightV">0</span>
    </div>

    <div class="stig hd-only" id="alignRow">
      <div class="pad" id="apad">
        <div class="cross cx"></div><div class="cross cy"></div>
        <div class="dot align" id="apadDot"></div>
      </div>
      <div class="side">
        <div class="lab">Beam Align</div>
        <div>X&nbsp;<span class="v" id="alignXV">0</span></div>
        <div>Y&nbsp;<span class="v" id="alignYV">0</span></div>
        <div style="color:#7a838b;margin-top:4px;line-height:1.4">turn on WOBB,<br>stop the image<br>from shifting.</div>
      </div>
    </div>

    <div class="footer">
      <div class="toggle" id="wobbBtn"><span class="led"></span>WOBB</div>
      <button class="btn-ghost" id="newBtn">New Sample</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<div class="overlay on" id="overlay">
  <h1 id="ovTitle">SEM TUNER</h1>
  <p id="ovDesc">フォーカスとスティグマで像を鋭く、コントラスト/ブライトネスで階調を合わせて Capture。鋭いほど高得点・時間加算。雑な撮影は減点。</p>
  <p class="big" id="ovScore" style="display:none">0</p>
  <div class="modesel" id="modesel">
    <button class="modebtn sel" data-mode="normal" id="modeNormal">
      <span class="mt">NORMAL</span><span class="md">通常モード ・ 像質バーあり</span>
    </button>
    <button class="modebtn" data-mode="hard" id="modeHard">
      <span class="mt">HARD ・ WOBB</span><span class="md">ビーム軸調整 ・ 像質バーなし</span>
    </button>
    <button class="modebtn" data-mode="expert" id="modeExpert">
      <span class="mt">EXPERT</span><span class="md">時間無制限 ・ WOBB ・ 10枚の合計スコア</span>
    </button>
  </div>
  <button id="startBtn">Start</button>
</div>

<script>
(function(){
  "use strict";
  // ---------- glyph pool ----------
  const GLYPHS = [
    ..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ",
    ..."アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロ",
    ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    ..."0123456789",
    ..."αβγδεζηθλμξπρστφχψω"
  ];

  // ---------- state ----------
  const S = {
    running:false, time:30, score:0,
    // user controls
    focus:0, stigX:0, stigY:0, contrast:1.0, bright:0,
    // hidden truths for current sample
    f0:0, aX:0, aY:0, g0:1, b0:0,
    // wobble / axis (high-difficulty layer)
    //   axisX/Y = hidden column drift (accumulates) ; alignX/Y = user correction (persistent)
    wobb:false, axisX:0, axisY:0, alignX:0, alignY:0, wobbDifficulty:false,
    mode:"normal", shot:1, shotsMax:10,
    glyph:"", t0:0
  };

  const EXPERT_SHOTS = 10;

  const K_BLUR = 0.085;   // physics units -> px stdDeviation
  const S_MIN  = 0.45;    // baseline blur (never a perfect delta)
  const A_MAX  = 60;      // max residual astigmatism magnitude (user units)
  const F_MAX  = 70;      // max defocus offset
  const SIG_S  = 2.4;     // sharpness tolerance: tighter -> focus/stig/axis errors bite hard
  const SIG_G  = 0.70;    // contrast tolerance (low weight overall)
  const SIG_B  = 115;     // brightness tolerance: very loose -> largely a matter of preference
  const W_SHARP= 0.82, W_TONE=0.18;   // sharpness now dominates the score
  const Q0     = 0.45;    // pass line for time gain           [was 0.55]
  const T_MAX  = 14.0;    // max time added per capture        [was 9.0]
  const START_T= 120;     // starting time (s)                 [was 60]
  const K_AXIS = 0.075;   // beam-misalignment -> isotropic resolution loss (px)
  const AXIS_DRIFT = 11;  // per-sample drift step in high-difficulty
  const AXIS_CLAMP = 50;

  // ---------- dom ----------
  const $ = id=>document.getElementById(id);
  const scene=$("scene"), rotA=$("rotA"), rotC=$("rotC"), blur=$("blur");
  const fR=$("fR"),fG=$("fG"),fB=$("fB");
  const focusEl=$("focus"),contrastEl=$("contrast"),brightEl=$("bright");
  const pad=$("pad"),padDot=$("padDot");
  const apad=$("apad"),apadDot=$("apadDot");

  // ---------- scene drawing ----------
  // content drawn oversized (480x480 centered on 150,150 of a 300 viewport)
  // so -theta rotation never exposes empty corners.
  // lo,hi (0..1): the sample's NATIVE luminance window. Everything is drawn
  // compressed into [lo,hi]; the correct gain/offset expands it to full [0,1],
  // so the step wedge reaching true black->white IS the visual cue for tone.
  function buildScene(glyph, lo, hi){
    const cx=150, cy=150;
    const span=hi-lo;
    const map=v01=>Math.round(255*(lo+Math.max(0,Math.min(1,v01))*span)); // design 0..1 -> compressed 0..255
    const rgb=v01=>{const v=map(v01);return `rgb(${v},${v},${v})`;};
    // grayscale step wedge spans the full design range 0..1 (defines native lo/hi)
    let bars="";
    const n=9;
    for(let i=0;i<n;i++){
      const v=map(i/(n-1));
      const x=30+i*(240/n);
      bars+=`<rect x="${x.toFixed(1)}" y="258" width="${(240/n-2).toFixed(1)}" height="20" fill="rgb(${v},${v},${v})"/>`;
    }
    // faint SEM-like grain (edges reveal directional blur)
    let grain="";
    for(let i=0;i<140;i++){
      const gx=(Math.random()*420-60), gy=(Math.random()*420-60);
      const r=(Math.random()*1.6+0.4).toFixed(2);
      grain+=`<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${r}" fill="${rgb(0.47+Math.random()*0.35)}" opacity="0.5"/>`;
    }
    // contamination: clustered dark deposits (carbon-like). These sit ON and around
    // the glyph so that contrast/brightness errors visibly hurt readability.
    let contam="";
    const clusters=2+Math.floor(Math.random()*3);
    for(let c=0;c<clusters;c++){
      // bias some clusters near the glyph so they interact with readability,
      // but keep them light enough that a well-tuned glyph still reads clearly
      const onGlyph=Math.random()<0.45;
      const ccx = onGlyph ? cx+(Math.random()*120-60) : 30+Math.random()*240;
      const ccy = onGlyph ? cy+(Math.random()*120-60) : 30+Math.random()*240;
      const dots=5+Math.floor(Math.random()*7);
      for(let d=0;d<dots;d++){
        const dx=ccx+(Math.random()*2-1)*16*Math.sqrt(-2*Math.log(Math.random()+1e-6))*0.4;
        const dy=ccy+(Math.random()*2-1)*16*Math.sqrt(-2*Math.log(Math.random()+1e-6))*0.4;
        const r=(Math.random()*2.6+1.0).toFixed(2);
        contam+=`<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${r}" fill="${rgb(0.03+Math.random()*0.16)}" opacity="${(0.28+Math.random()*0.32).toFixed(2)}"/>`;
      }
    }
    // glyph fill: STRONG internal gradient -> the letter spans a wide tonal range,
    // so it only reads well when contrast/brightness sit in the sweet spot.
    const ga=Math.random()*Math.PI;
    const x1=(50-Math.cos(ga)*50).toFixed(1), y1=(50-Math.sin(ga)*50).toFixed(1);
    const x2=(50+Math.cos(ga)*50).toFixed(1), y2=(50+Math.sin(ga)*50).toFixed(1);
    const gHi=0.94+Math.random()*0.06, gLo=0.42+Math.random()*0.13;   // wide spread (was 0.60..1.0)
    // bright & dark fiducial points placed in the field: over-contrast clips them
    // (white-out / crush), under-contrast leaves them flat -> they mark the extremes.
    let marks="";
    const mk=(v,rmin,rmax)=>{
      const ang=Math.random()*Math.PI*2, rad=52+Math.random()*62;
      const mx=cx+Math.cos(ang)*rad, my=cy+Math.sin(ang)*rad;
      const r=(rmin+Math.random()*(rmax-rmin)).toFixed(2);
      return `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${r}" fill="${rgb(v)}"/>`;
    };
    for(let i=0;i<3;i++) marks+=mk(0.97+Math.random()*0.03, 2.6, 5.4);  // bright specks ~ design 1.0
    for(let i=0;i<3;i++) marks+=mk(Math.random()*0.04, 3.0, 6.8);       // dark pits  ~ design 0.0
    // background: gentle field gradient so brightness varies across the frame
    const bgA=rgb(0.05+Math.random()*0.05), bgB=rgb(0.10+Math.random()*0.06);
    const ring=rgb(0.22);

    scene.innerHTML = `
      <defs>
        <linearGradient id="glyphGrad" x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%">
          <stop offset="0%" stop-color="${rgb(gHi)}"/>
          <stop offset="100%" stop-color="${rgb(gLo)}"/>
        </linearGradient>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="${bgA}"/>
          <stop offset="100%" stop-color="${bgB}"/>
        </linearGradient>
      </defs>
      <rect x="-90" y="-90" width="480" height="480" fill="url(#bgGrad)"/>
      <g>${grain}</g>
      <circle cx="${cx}" cy="${cy}" r="96" fill="none" stroke="${ring}" stroke-width="2"/>
      <g>${marks}</g>
      <text x="${cx}" y="${cy+58}" font-family="Georgia, 'Times New Roman', serif"
            font-size="170" font-weight="700" text-anchor="middle" fill="url(#glyphGrad)">${glyph}</text>
      <g>${contam}</g>
      <g opacity="0.9">${bars}</g>
    `;
  }
  // Given a native window [lo,hi], the gain/offset that expand it to [0,1].
  // render(): out = g*(in-0.5)+0.5 + bright/255  (pivot = mid-gray)
  function toneTargetFor(lo,hi){
    const g0 = 1/(hi-lo);
    const b0 = 255*(g0*(0.5-lo) - 0.5);
    return { g0, b0 };
  }

  // ---------- physics / render ----------
  function netAstig(){ // residual astigmatism vector after user correction
    return { x: S.aX + S.stigX, y: S.aY + S.stigY };
  }
  function netAxis(){ // residual beam-axis error after user alignment
    return { x: S.axisX + S.alignX, y: S.axisY + S.alignY };
  }
  function render(t){
    // defocus, with optional wobble oscillation in high-difficulty mode
    let D = S.focus - S.f0;
    const R = netAstig();
    const a = Math.hypot(R.x, R.y) * 0.5;     // half astigmatic separation
    const theta = Math.atan2(R.y, R.x) * 0.5; // physical axis (2θ space -> θ)
    const ax = netAxis();
    const axMag = Math.hypot(ax.x, ax.y);

    // wobble: oscillate focus; axis misalignment => lateral image shift synced to defocus
    let shiftX=0, shiftY=0, Dw=D;
    if(S.wobb){
      const osc = Math.sin(t*0.011); // ~ slow wobble
      Dw = D + osc*26;
      // axis error translates the image proportional to instantaneous defocus
      shiftX = ax.x * osc * 0.9;
      shiftY = ax.y * osc * 0.9;
    } else {
      // even off-wobble, axis error makes image "walk" slightly with defocus
      shiftX = ax.x * (D/F_MAX) * 0.5;
      shiftY = ax.y * (D/F_MAX) * 0.5;
    }

    // astigmatic blur along the two principal axes + isotropic loss from axis error
    const sAx = K_AXIS*axMag;
    const s1 = Math.hypot(Math.max(S_MIN, K_BLUR*Math.abs(Dw - a)), sAx);
    const s2 = Math.hypot(Math.max(S_MIN, K_BLUR*Math.abs(Dw + a)), sAx);

    // rotate filter frame to theta (deg); counter-rotate content
    const deg = theta*180/Math.PI;
    rotA.setAttribute("transform", `rotate(${deg.toFixed(2)} 150 150)`);
    rotC.setAttribute("transform", `rotate(${(-deg).toFixed(2)} 150 150) translate(${shiftX.toFixed(2)} ${shiftY.toFixed(2)})`);
    blur.setAttribute("stdDeviation", `${s1.toFixed(3)} ${s2.toFixed(3)}`);

    // tone: gain (contrast) & offset (brightness) ; intercept folds in -gain*0.5+0.5+bright
    const g = S.contrast, off = (S.bright/255) + 0.5 - g*0.5;
    [fR,fG,fB].forEach(f=>{f.setAttribute("slope",g.toFixed(3));f.setAttribute("intercept",off.toFixed(3));});

    return { s1, s2, a };
  }

  // quality on a NON-wobble snapshot (capture is blocked during wobble)
  function quality(){
    const D = S.focus - S.f0;
    const R = netAstig();
    const a = Math.hypot(R.x,R.y)*0.5;
    const ax = netAxis();
    const sAx = K_AXIS*Math.hypot(ax.x, ax.y);   // same isotropic loss the renderer shows
    const s1 = Math.hypot(Math.max(S_MIN, K_BLUR*Math.abs(D - a)), sAx);
    const s2 = Math.hypot(Math.max(S_MIN, K_BLUR*Math.abs(D + a)), sAx);
    const sharp = Math.exp(-((s1*s1+s2*s2))/(2*SIG_S*SIG_S));
    const tone = Math.exp(-(((S.contrast-S.g0)*(S.contrast-S.g0))/(2*SIG_G*SIG_G)
                          + ((S.bright-S.b0)*(S.bright-S.b0))/(2*SIG_B*SIG_B)));
    let q = W_SHARP*sharp + W_TONE*tone;
    return Math.max(0, Math.min(1, q));
  }

  // ---------- sample lifecycle ----------
  function newSample(){
    S.glyph = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
    // native luminance window: content is washed-out / mis-leveled until corrected.
    // Parameterize by span (-> gain) and midpoint (-> brightness), bounding both
    // so the derived target stays inside the slider ranges.
    //   gain g0 = 1/span ,  bright b0 = 255*(0.5-mid)/span
    const span = 0.60 + Math.random()*0.20;               // 0.60..0.80 -> g0 1.25..1.67 (gentler contrast)
    const midOff = (Math.random()*2-1) * 0.26*span;       // modest brightness offset
    const mid = 0.5 + midOff;
    let lo = mid - span/2, hi = mid + span/2;
    lo = Math.max(0.03, lo); hi = Math.min(0.97, hi);
    S.lo = lo; S.hi = hi;
    buildScene(S.glyph, S.lo, S.hi);
    const tt = toneTargetFor(S.lo, S.hi);
    S.g0 = tt.g0; S.b0 = tt.b0;                            // tone target derived from image
    // truths
    S.f0 = (Math.random()*2-1)*F_MAX*0.7;
    const aMag = A_MAX*(0.45+Math.random()*0.55), aAng=Math.random()*Math.PI*2;
    S.aX = Math.cos(aAng)*aMag; S.aY=Math.sin(aAng)*aMag;
    // reset user controls to a deliberately detuned start
    S.focus = clamp(S.f0 + (Math.random()*2-1)*45, -100,100);
    S.stigX = clamp(-S.aX + (Math.random()*2-1)*35, -100,100);
    S.stigY = clamp(-S.aY + (Math.random()*2-1)*35, -100,100);
    S.contrast = 1.0; S.bright = 0;
    // beam-axis drift across samples (high-difficulty only). align is NOT reset:
    // the column slowly drifts and the player re-nulls it with the align pad.
    if(S.wobbDifficulty){
      S.axisX = clamp(S.axisX + (Math.random()*2-1)*AXIS_DRIFT, -AXIS_CLAMP, AXIS_CLAMP);
      S.axisY = clamp(S.axisY + (Math.random()*2-1)*AXIS_DRIFT, -AXIS_CLAMP, AXIS_CLAMP);
    } else { S.axisX=0; S.axisY=0; S.alignX=0; S.alignY=0; }
    syncControls();
    $("hudGlyph").textContent = "TARGET";
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function syncControls(){
    focusEl.value=Math.round(S.focus);
    contrastEl.value=Math.round(S.contrast*100);
    brightEl.value=Math.round(S.bright);
    $("focusV").textContent=Math.round(S.focus);
    $("contrastV").textContent=S.contrast.toFixed(2);
    $("brightV").textContent=Math.round(S.bright);
    setPad(S.stigX,S.stigY);
    $("stigXV").textContent=Math.round(S.stigX);
    $("stigYV").textContent=Math.round(S.stigY);
    setAPad(S.alignX,S.alignY);
    $("alignXV").textContent=Math.round(S.alignX);
    $("alignYV").textContent=Math.round(S.alignY);
  }

  // ---------- pad (stigmator) ----------
  function setPad(x,y){
    const px=50+ (x/100)*46, py=50- (y/100)*46;
    padDot.style.left=px+"%"; padDot.style.top=py+"%";
  }
  function padFromEvent(e){
    const r=pad.getBoundingClientRect();
    const cx=e.clientX-r.left-r.width/2, cy=e.clientY-r.top-r.height/2;
    S.stigX=clamp((cx/(r.width/2))*100,-100,100);
    S.stigY=clamp((-cy/(r.height/2))*100,-100,100);
    setPad(S.stigX,S.stigY);
    $("stigXV").textContent=Math.round(S.stigX);
    $("stigYV").textContent=Math.round(S.stigY);
  }
  let padding=false;
  pad.addEventListener("pointerdown",e=>{padding=true;pad.setPointerCapture(e.pointerId);padFromEvent(e);});
  pad.addEventListener("pointermove",e=>{if(padding)padFromEvent(e);});
  pad.addEventListener("pointerup",e=>{padding=false;});
  pad.addEventListener("pointercancel",e=>{padding=false;});

  // ---------- pad (beam align, high-difficulty) ----------
  function setAPad(x,y){
    const px=50+ (x/AXIS_CLAMP)*46, py=50- (y/AXIS_CLAMP)*46;
    apadDot.style.left=Math.max(2,Math.min(98,px))+"%";
    apadDot.style.top=Math.max(2,Math.min(98,py))+"%";
  }
  function apadFromEvent(e){
    const r=apad.getBoundingClientRect();
    const cx=e.clientX-r.left-r.width/2, cy=e.clientY-r.top-r.height/2;
    S.alignX=clamp((cx/(r.width/2))*AXIS_CLAMP,-AXIS_CLAMP,AXIS_CLAMP);
    S.alignY=clamp((-cy/(r.height/2))*AXIS_CLAMP,-AXIS_CLAMP,AXIS_CLAMP);
    setAPad(S.alignX,S.alignY);
    $("alignXV").textContent=Math.round(S.alignX);
    $("alignYV").textContent=Math.round(S.alignY);
  }
  let apadding=false;
  apad.addEventListener("pointerdown",e=>{apadding=true;apad.setPointerCapture(e.pointerId);apadFromEvent(e);});
  apad.addEventListener("pointermove",e=>{if(apadding)apadFromEvent(e);});
  apad.addEventListener("pointerup",e=>{apadding=false;});
  apad.addEventListener("pointercancel",e=>{apadding=false;});

  // ---------- sliders ----------
  focusEl.addEventListener("input",e=>{S.focus=+e.target.value;$("focusV").textContent=Math.round(S.focus);});
  contrastEl.addEventListener("input",e=>{S.contrast=(+e.target.value)/100;$("contrastV").textContent=S.contrast.toFixed(2);});
  brightEl.addEventListener("input",e=>{S.bright=+e.target.value;$("brightV").textContent=Math.round(S.bright);});

  // ---------- wobble ----------
  $("wobbBtn").addEventListener("click",()=>{
    if(!S.wobbDifficulty){ flash("WOBB は高難易度モードのみ", "var(--txt-dim)"); return; }
    S.wobb=!S.wobb;
    $("wobbBtn").classList.toggle("on",S.wobb);
    $("wobbtag").classList.toggle("on",S.wobb);
    $("captureBtn").disabled = S.wobb;
  });

  // ---------- capture ----------
  function capture(){
    if(!S.running || S.wobb) return;
    const q=quality();
    const pts=Math.round((q*q)*1000);
    showJudge(q);

    if(S.mode==="expert"){
      // unlimited time; every shot counts toward the 10-sample total
      S.score+=pts;
      flash(`+${pts}`, q>=Q0 ? "var(--good)" : "var(--bad)");
      updateTop();
      if(S.shot>=S.shotsMax){ gameOver(); return; }
      S.shot++; updateShotReadout(); newSample();
      return;
    }

    // timed modes: capture adjusts the clock (low quality -> penalty)
    const dt=T_MAX*(q-Q0);
    S.time=Math.max(0,S.time+dt);
    if(q>=Q0){ S.score+=pts; flash(`+${pts}  ${dt>=0?'+':''}${dt.toFixed(1)}s`, "var(--good)"); }
    else { S.score=Math.max(0,S.score-Math.round((Q0-q)*400)); flash(`${dt.toFixed(1)}s`, "var(--bad)"); }
    updateTop();
    if(S.time<=0){ gameOver(); return; }
    newSample();
  }
  $("captureBtn").addEventListener("click",capture);
  $("newBtn").addEventListener("click",()=>{ if(S.running && S.mode!=="expert") newSample(); });

  // ---------- judgment popup (rhythm-game style) ----------
  const JUDGES=[
    {min:0.90, t:"Excellent!!!", c:"#ffcf3a", glow:"rgba(255,176,0,.65)"},
    {min:0.75, t:"Great!",       c:"#62e6c3", glow:"rgba(60,210,160,.55)"},
    {min:Q0,   t:"Good",         c:"#9fc3e2", glow:"rgba(127,168,201,.45)"},
    {min:-1,   t:"Umm...",       c:"#e2603f", glow:"rgba(226,96,63,.45)"}
  ];
  function showJudge(q){
    const j=JUDGES.find(x=>q>=x.min);
    const el=$("judge");
    el.textContent=j.t;
    el.style.color=j.c;
    el.style.textShadow=`0 0 18px ${j.glow}, 0 2px 10px rgba(0,0,0,.7)`;
    el.classList.remove("play");
    void el.offsetWidth;          // reflow to restart animation
    el.classList.add("play");
  }

  // ---------- flash ----------
  let flashT;
  function flash(msg,color){
    const f=$("flash"); f.textContent=msg; f.style.color=color||"var(--amber)";
    f.style.borderColor=color||"var(--amber)"; f.style.background="rgba(10,12,14,.92)";
    f.style.border="1px solid "+(color||"var(--amber)");
    f.classList.add("show"); clearTimeout(flashT);
    flashT=setTimeout(()=>f.classList.remove("show"),850);
  }

  // ---------- loop ----------
  let last=performance.now();
  function frame(now){
    const dt=(now-last)/1000; last=now;
    if(S.running && S.mode!=="expert"){
      S.time=Math.max(0,S.time-dt);
      if(S.time<=0){ updateTop(); gameOver(); }
    }
    render(now);
    // live quality (frozen sensible value during wobble)
    const q = S.wobb ? 0 : quality();
    $("qfill").style.width=(q*100).toFixed(1)+"%";
    $("qpct").textContent=Math.round(q*100)+"%";
    if(S.mode!=="expert") updateTime();
    requestAnimationFrame(frame);
  }
  function updateTop(){ $("scoreV").textContent=S.score; }
  function updateTime(){
    const tv=$("timeV"); tv.textContent=S.time.toFixed(1);
    tv.classList.toggle("warn", S.time<8);
  }

  // ---------- game over / start ----------
  function gameOver(){
    S.running=false;
    $("ovTitle").textContent = S.mode==="expert" ? "EXPERT — 10 SHOTS" : "GAME OVER";
    $("ovDesc").style.display="none";
    $("ovScore").style.display="block";
    $("ovScore").textContent=S.score;
    $("startBtn").textContent="Retry";
    $("overlay").classList.add("on");
  }
  // IMG QUALITY bar visible only in normal mode; align pad + WOBB shown when axis layer is on.
  function applyMode(){
    $("qwrap").style.display = S.wobbDifficulty ? "none" : "flex";
    document.querySelector(".console").classList.toggle("hd-active", S.wobbDifficulty);
    $("wobbBtn").style.display = S.wobbDifficulty ? "flex" : "none";
    // expert: show a shot counter instead of a timer; New Sample disabled
    const expert = S.mode==="expert";
    $("rk2").textContent = expert ? "Shot" : "Time";
    $("newBtn").style.display = expert ? "none" : "block";
  }
  function updateShotReadout(){
    $("timeV").classList.remove("warn");
    $("timeV").textContent = S.shot + " / " + S.shotsMax;
  }
  function start(){
    S.running=true; S.score=0; S.shot=1; S.shotsMax=EXPERT_SHOTS;
    S.time=START_T;
    S.axisX=0;S.axisY=0;S.alignX=0;S.alignY=0;S.wobb=false;
    $("wobbBtn").classList.remove("on");$("wobbtag").classList.remove("on");$("captureBtn").disabled=false;
    applyMode();
    if(S.mode==="expert") updateShotReadout();
    $("overlay").classList.remove("on");
    updateTop(); newSample();
  }
  $("startBtn").addEventListener("click",start);

  // mode selection on the overlay
  function selectMode(mode){
    S.mode=mode;
    S.wobbDifficulty = (mode==="hard" || mode==="expert");
    $("modeNormal").classList.toggle("sel", mode==="normal");
    $("modeHard").classList.toggle("sel", mode==="hard");
    $("modeExpert").classList.toggle("sel", mode==="expert");
  }
  $("modeNormal").addEventListener("click",()=>selectMode("normal"));
  $("modeHard").addEventListener("click",()=>selectMode("hard"));
  $("modeExpert").addEventListener("click",()=>selectMode("expert"));

  // boot
  selectMode("normal");
  applyMode();
  buildScene("あ", 0.12, 0.62);
  render(performance.now());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
