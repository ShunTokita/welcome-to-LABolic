<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Furnace Minigame</title>
<link rel="stylesheet" href="mg-core.css">
<link rel="stylesheet" href="mg-proc.css">
<style>html,body{margin:0;height:100%;background:#0a0c0e;overscroll-behavior:none;}</style>
</head>
<body>
<div id="mg"></div>
<script src="mg-core.js"></script>
<script src="mg-3d.js"></script>
<script src="mg-proc.js"></script>
<script>
// Furnace — vacuum sealing a quartz tube over a burner.
//
// One tap on Roll sets the tube turning over the flame, and it keeps
// turning by itself; the player's job is the pull. The wall is tracked in
// eight sectors around the circumference: the one facing down takes the
// flame, heat spreads to its neighbours, and everything loses a little to
// the air. Steady turning keeps the sectors level. Left unturned, one
// sector stays in the flame, runs ahead of the rest, thins and opens a
// hole, so Roll is the first thing to press.
//
// Once the glass softens, the vacuum inside pulls the neck in. Pull the
// tube apart while the neck is in the right range: too early and the
// drawn-out seal is thin-walled, too late and the soft tube sags.
//
// Score = timing of the pull (the even heating that turning gives is
// still checked, but with automatic turning it is always met).
(function(){
  "use strict";
  const { Renderer, mat, build } = M3;
  const P = MGProc;

  // ---- model (tuned with an offline simulation) ----
  const NS = 8;                  // sectors around the tube
  const Q = 0.45;                // flame heating of the sector facing down (/s)
  const COOL = 0.10, COND = 0.6; // loss to air; spread to neighbours
  const SOFT = 0.45;             // glass soft enough to deform
  const COLLAPSE_T = 0.55, K_COLLAPSE = 0.9;
  const THIN_EXCESS = 0.15, K_THIN = 4;   // a sector this far above mean thins
  const SAG_R = 0.14;            // neck below this: the tube sags
  const WIN = [0.22, 0.32];      // neck radius for a clean pull
  const SPIN = 3.9;              // turning speed once rolling (rad/s)

  const R0 = 0.16, L = 1.35;

  function build_(body, ctx) {
    body.innerHTML = `
      <div class="pc">
        <div class="pc-stage"><canvas></canvas>
          <div class="pc-hud"><div class="tl">O₂-H₂ burner</div><div class="tr" id="pState">heating</div></div>
        </div>
        <div class="pc-gauges">
          <div class="pc-gauge">
            <span class="k">Neck ⌀</span>
            <div class="pc-meter" id="neckM"><div class="pc-win" id="neckWin"></div><div class="pc-fill danger" id="neckF"></div></div>
          </div>
        </div>
        <div class="pc-buttons">
          <button class="pc-btn" id="roll">回す</button>
          <button class="pc-btn act" id="pull">引く</button>
        </div>
      </div>`;
    const $ = id => body.querySelector('#' + id);
    const r3 = new Renderer(body.querySelector('canvas'), { bg:[16, 18, 24], light:[-0.3, 0.9, 0.6] });
    r3.camera([0.55, 0.95, 2.6], [0, -0.3, 0], 38);
    const tips = P.tips(body);
    const siren = P.alarm(body);

    // Static scenery.
    const bench = build.box(3.6, 0.1, 1.6, [92, 80, 68]);   bench.m = mat.tr(0, -0.8, 0);
    const burner = build.cylinder(0.055, 0.36, 20, [128, 134, 142]); burner.m = mat.tr(0, -0.75, 0);
    const nozzle = build.cylinder(0.035, 0.05, 20, [170, 150, 90]);  nozzle.m = mat.tr(0, -0.39, 0);
    const hose = build.lathe([[-2.2, 0.075], [-L, 0.075]], 20, [52, 54, 60]);
    // A back wall, so the clear tube has something to be seen against.
    const wall = build.box(5, 3, 0.1, [70, 76, 86]); wall.m = mat.tr(0, 0.6, -1.1);

    let S;
    function reset() {
      S = { h: new Array(NS).fill(0), thin: new Array(NS).fill(0), th: 0, r: 1,
            rolling: false, spreadAcc: 0, spreadN: 0, phase: 'heat', anim: 0 };
      $('pState').textContent = 'heating';
      $('roll').disabled = false;
      $('roll').textContent = '回す';
    }

    const meanH = () => S.h.reduce((a, b) => a + b) / NS;

    $('roll').addEventListener('click', () => {
      if (!ctx.running || S.phase !== 'heat' || S.rolling) return;
      S.rolling = true;
      $('roll').disabled = true;
      $('roll').textContent = '回転中';
    });

    function finish(q, msg, phase) {
      S.phase = phase; S.anim = 0;
      $('pState').textContent = phase;
      if (msg) ctx.flash(msg, q >= 0.9 ? '#5fd38a' : '#e2603f');
      ctx.judge(q);
    }

    $('pull').addEventListener('click', () => {
      if (!ctx.running || S.phase !== 'heat') return;
      const r = S.r;
      if (meanH() < SOFT) { ctx.flash('まだ柔らかくない', '#9fc3e2'); return; }
      const off = r < WIN[0] ? WIN[0] - r : r > WIN[1] ? r - WIN[1] : 0;
      const timing = Math.exp(-(off * off) / (2 * 0.04 * 0.04));
      const spread = S.spreadAcc / Math.max(1, S.spreadN);
      const even = Math.exp(-(Math.max(0, spread - 0.10) ** 2) / (2 * 0.06 * 0.06));
      const q = timing * even;
      const msg = r > WIN[1] + 0.08 ? '早すぎ：封じ口が薄い' : even < 0.8 ? '加熱ムラ：肉厚が不揃い' : null;
      finish(q, msg, 'pulled');
    });

    // ---- per-frame model ----
    function step(dt) {
      if (S.phase !== 'heat') { S.anim += dt; if (S.anim > 2.2 && ctx.running) reset(); return; }
      if (S.rolling) S.th += SPIN * dt;
      const h = S.h, nh = h.slice();
      for (let s = 0; s < NS; s++) {
        const c = Math.cos(s * 2 * Math.PI / NS + S.th - Math.PI);
        const w = c > 0 ? c ** 4 : 0;
        const lap = h[(s + 1) % NS] + h[(s + NS - 1) % NS] - 2 * h[s];
        nh[s] += (Q * w - COOL * h[s] + COND * lap) * dt;
      }
      S.h = nh;
      const m = meanH(), mx = Math.max(...nh), mn = Math.min(...nh);
      if (m > SOFT) {
        S.spreadAcc += mx - mn; S.spreadN++;
        for (let s = 0; s < NS; s++) {
          const ex = nh[s] - m - THIN_EXCESS;
          if (ex > 0) S.thin[s] += ex * dt * K_THIN;
          if (S.thin[s] >= 1) { S.holeAt = s; finish(0.1, '穴が開いた！', 'leak'); return; }
        }
      }
      if (m > COLLAPSE_T) S.r -= K_COLLAPSE * (m - COLLAPSE_T) * S.r * dt;
      if (S.r < SAG_R) finish(0.15, '遅すぎ：管が垂れた', 'sagged');
    }

    // ---- drawing ----
    // Clear fused quartz: a faint tint, made visible by its edges and
    // highlights. Worked in the oxy-hydrogen flame it glows white.
    const GLASS = { c:[205, 232, 240], a:0.10, glass:true };
    function glow(t) {          // heat 0..1 -> face style, or null when not glowing
      if (t < 0.30) return null;
      const k = Math.min(1, (t - 0.30) / 0.5);
      return { c:[255, 236 + 19 * k, 205 + 50 * k], e:true, a:0.25 + 0.75 * k };
    }
    function tubeProfile(x0, x1, neckX, rr, tipR) {
      const prof = [];
      const n = 44;
      for (let i = 0; i <= n; i++) {
        const u = i / n;
        // Denser sampling toward the neck.
        const x = x0 + (x1 - x0) * (neckX === x1 ? 1 - (1 - u) ** 2 : u ** 2);
        const g = Math.exp(-(((x - neckX) / 0.13) ** 2));
        let r = R0 * (1 - (1 - rr) * g);
        if (tipR !== undefined && Math.abs(x - neckX) < 1e-6) r = tipR;
        prof.push([x, r]);
      }
      return prof;
    }
    function tubeMesh(prof, offX) {
      const SEG = 24;
      const m = build.lathe(prof, SEG, (i, j) => {
        const x = (prof[i][0] + prof[i + 1][0]) / 2 - offX;
        const s = Math.floor(j * NS / SEG);
        const ax = Math.exp(-((x / 0.16) ** 2));
        return glow(S.h[s] * ax * 1.15) || GLASS;
      }, true);
      m.ds = true;               // the far wall shows through the near one
      return m;
    }

    function flame(t) {
      const f = 1 + 0.12 * Math.sin(t * 0.031) + 0.08 * Math.sin(t * 0.077);
      // An oxy-hydrogen flame: a pale blue envelope around a brighter cone,
      // added onto whatever is behind so the tube shows through it.
      const outer = build.lathe([[0, 0.07], [0.12 * f, 0.06], [0.26 * f, 0.025]], 16, { c:[50, 100, 255], e:true, add:true, a:0.45 });
      const inner = build.lathe([[0, 0.035], [0.1 * f, 0.02], [0.15 * f, 0.004]], 16, { c:[160, 205, 255], e:true, add:true, a:0.9 });
      // Lathe builds along x; stand the cones up on the nozzle.
      outer.m = mat.chain(mat.tr(0, -0.34, 0), mat.rz(Math.PI / 2));
      inner.m = mat.chain(mat.tr(0, -0.34, 0.001), mat.rz(Math.PI / 2));
      outer.ds = inner.ds = true;
      return [outer, inner];
    }

    function render(now) {
      const meshes = [wall, bench, burner, nozzle, hose];
      const rot = mat.rx(S.th);
      if (S.phase === 'pulled') {
        // The two halves draw apart and the neck closes off at each tip.
        const d = Math.min(0.5, S.anim * 0.9);
        const a = tubeMesh(tubeProfile(-L, 0, 0, S.r, 0.004), 0); a.m = rot;
        const b = tubeMesh(tubeProfile(0, L, 0, S.r, 0.004), 0); b.m = mat.chain(mat.tr(d, 0, 0), rot);
        meshes.push(a, b);
      } else if (S.phase === 'sagged') {
        const bend = Math.min(0.35, S.anim * 0.4);
        const a = tubeMesh(tubeProfile(-L, 0, 0, S.r), 0); a.m = mat.chain(mat.rz(bend), rot);
        const b = tubeMesh(tubeProfile(0, L, 0, S.r), 0); b.m = mat.chain(mat.rz(-bend), rot);
        meshes.push(a, b);
      } else {
        const t = tubeMesh(tubeProfile(-L, L, 0, S.r), 0); t.m = rot;
        meshes.push(t);
      }
      if (S.phase === 'heat' || S.anim < 0.6) meshes.push(...flame(now));
      r3.draw(meshes, g => {
        // White-hot glass lights up the air around it.
        const hot = Math.max(...S.h);
        if (S.phase !== 'leak' && hot > 0.35) {
          const k = Math.min(1, (hot - 0.35) / 0.5) * (S.phase === 'heat' ? 1 : Math.max(0, 1 - S.anim / 1.5));
          const p = r3.project([0, 0, 0]);
          if (p && k > 0) {
            const rad = 28 + 34 * k;
            const gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], rad);
            gr.addColorStop(0, `rgba(255,248,230,${(0.55 * k).toFixed(3)})`);
            gr.addColorStop(1, 'rgba(255,240,210,0)');
            g.globalCompositeOperation = 'lighter';
            g.fillStyle = gr; g.fillRect(p[0] - rad, p[1] - rad, rad * 2, rad * 2);
            g.globalCompositeOperation = 'source-over';
          }
        }
        if (S.phase === 'leak' && S.anim < 1.2) {
          // A white-hot pinhole, then it goes dark.
          const p = r3.project([0, -0.02, R0]);
          if (p) { g.fillStyle = S.anim < 0.5 ? '#fff6d0' : '#222'; g.fillRect(p[0] - 2, p[1] - 2, 5, 5); }
        }
      });
    }

    function drawGauges() {
      // Neck: full bar at the starting diameter.
      $('neckF').style.width = (S.r * 100).toFixed(1) + '%';
      const win = $('neckWin');
      win.style.left = (WIN[0] * 100) + '%';
      win.style.width = ((WIN[1] - WIN[0]) * 100) + '%';
      // Amber while it narrows, green in the window, red once past it.
      $('neckF').style.backgroundColor = S.r > WIN[1] ? '#e8b84a' : S.r >= WIN[0] ? '#5fd38a'
        : P.dangerColor(0.6 + 0.4 * lateDanger());
    }

    // Danger: a hot spot thinning the wall (the tube is not being turned),
    // or the neck past the window and heading for a sag.
    const lateDanger = () => S.r < WIN[0] ? Math.min(1, (WIN[0] - S.r) / (WIN[0] - SAG_R)) : 0;
    function alarm() {
      if (S.phase === 'leak' || S.phase === 'sagged') return siren.set(ctx.running && S.anim < 1.2, 4);
      if (!ctx.running || S.phase !== 'heat') return siren.set(false);
      // The hot spot sounds as soon as one sector runs past the thinning
      // threshold, well before the hole opens.
      const hot = Math.max(...S.h) - meanH() > THIN_EXCESS;
      const hole = Math.max(...S.thin), late = lateDanger();
      siren.set(hot || hole > 0.05 || late > 0, 1.5 + 3 * Math.max(hole, late));
    }

    function tipNow() {
      if (!ctx.running || S.phase !== 'heat') return tips.hide();
      if (meanH() > SOFT && S.r < WIN[1] + 0.12) return tips.show($('pull'), '細くなったら引こう！');
      if (!S.rolling) return tips.show($('roll'), '回して加熱しよう！');
      tips.hide();
    }

    reset();
    return {
      start() { reset(); },
      tick(dt, now) {
        if (ctx.running || S.phase !== 'heat') step(dt);
        alarm();
        render(now);
        drawGauges();
        tipNow();
      },
    };
  }

  MG.mount(document.getElementById('mg'), {
    id: 'furnace',
    title: 'FURNACE',
    subtitle: 'Vacuum Sealing',
    desc: '「回す」で石英管を回しながら加熱する。真空で管がくびれていくので、ちょうどよい細さになったら「引く」で封じ切る。',
    goal: 1,
    build: build_,
  });
})();
</script>
</body>
</html>
