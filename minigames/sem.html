<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SEM Minigame</title>
<link rel="stylesheet" href="mg-core.css">
<style>
  html,body{margin:0;height:100%;background:#0a0c0e;overscroll-behavior:none;}
  :root{
    --line:#283038; --amber:#ffb000; --amber-dim:#9a6a00; --steel:#7fa8c9; --txt-dim:#6c7884;
    --mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
    --con-bg:#41464b; --con-bg2:#363b40; --con-line:#5a6166; --con-line2:#22262a;
    --con-txt:#cdd2d6; --con-txt-dim:#8a9197;
    --con-font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  .sem{display:flex;flex-direction:column;gap:10px;}

  .stage{position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--line);
    border-radius:6px;overflow:hidden;background:#000;}
  .stage svg{display:block;width:100%;height:100%;}
  .hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:10px;
    color:rgba(199,208,216,.55);letter-spacing:.08em;}
  .hud .tl{position:absolute;top:8px;left:10px;}
  .hud .tr{position:absolute;top:8px;right:10px;}
  .hud .bl{position:absolute;bottom:8px;left:10px;}
  .hud .br{position:absolute;bottom:8px;right:10px;}
  .scanlines{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.25;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);}

  .qwrap{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;color:var(--txt-dim);}
  .qbar{flex:1;height:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0d1115;}
  .qfill{height:100%;width:0%;background:linear-gradient(90deg,#5a2a1a,#caa23a,#5fd38a);transition:width .08s linear;}

  .console{background:linear-gradient(180deg,var(--con-bg),var(--con-bg2));
    border:1px solid var(--con-line2);border-radius:6px;padding:12px 12px 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font-family:var(--con-font);
    display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:12px;}
  .row .lab{width:74px;font-size:11px;letter-spacing:.04em;font-weight:700;color:var(--con-txt);text-transform:uppercase;}
  .row .val{width:42px;text-align:right;font-size:12px;color:#dfe4e8;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--con-line2);border-radius:2px;border:1px solid #14181b;}
  input[type=range]::-moz-range-track{height:3px;background:var(--con-line2);border-radius:2px;border:1px solid #14181b;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%, #f4f7fa, #8a99a6 60%, #4a565f);
    border:1px solid #0a0c0e;box-shadow:0 1px 3px rgba(0,0,0,.6);}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f4f7fa, #8a99a6 60%, #4a565f);border:1px solid #0a0c0e;}

  .stig{display:flex;gap:14px;align-items:stretch;}
  .pad{position:relative;width:104px;height:104px;border:1px solid var(--con-line2);border-radius:6px;
    background:radial-gradient(circle at center, #2c3033, #1d2123);flex:none;touch-action:none;
    box-shadow:inset 0 0 10px rgba(0,0,0,.45);}
  .pad .cross{position:absolute;background:#555c61;}
  .pad .cx{left:0;right:0;top:50%;height:1px;}
  .pad .cy{top:0;bottom:0;left:50%;width:1px;}
  .pad .dot{position:absolute;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--amber), #6a4700 70%);
    border:1px solid #0a0c0e;transform:translate(-50%,-50%);left:50%;top:50%;box-shadow:0 0 8px -2px var(--amber);}
  .stig .side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;
    font-size:11px;color:var(--con-txt-dim);}
  .stig .side .lab{color:var(--con-txt);text-transform:uppercase;font-weight:700;}
  .stig .side .v{color:#dfe4e8;font-size:12px;}

  .actions{display:flex;gap:10px;}
  .capture{flex:1;border:1px solid var(--amber-dim);background:linear-gradient(180deg,#241a05,#160f02);
    color:var(--amber);font-family:var(--mono);font-weight:700;letter-spacing:.18em;
    font-size:18px;border-radius:6px;padding:14px 0;text-transform:uppercase;cursor:pointer;}
  .capture:active{transform:scale(.985);box-shadow:0 0 0 1px var(--amber) inset, 0 0 18px -4px var(--amber);}
  .skip{font-family:var(--con-font);font-size:11px;font-weight:700;letter-spacing:.06em;
    color:var(--con-txt);text-transform:uppercase;border:1px solid var(--con-line);border-radius:6px;
    padding:0 14px;background:linear-gradient(180deg,#4a4f54,#3a3f44);cursor:pointer;}
</style>
</head>
<body>
<div id="mg"></div>
<script src="mg-core.js"></script>
<script>
// SEM — focus and stigmator.
//
// Ported from the NORMAL mode of the SEM prototype (sem-proto.html); the
// optics and the scoring constants are unchanged except that brightness no
// longer counts toward image quality. The player still has the control —
// it makes the image easier to read — but leaving it alone costs nothing.
(function(){
  "use strict";

  const GLYPHS = [
    ..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ",
    ..."アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロ",
    ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    ..."0123456789",
    ..."αβγδεζηθλμξπρστφχψω"
  ];

  const K_BLUR = 0.085;   // physics units -> px stdDeviation
  const S_MIN  = 0.45;    // baseline blur (never a perfect delta)
  const A_MAX  = 60;      // max residual astigmatism magnitude
  const F_MAX  = 70;      // max defocus offset
  const SIG_S  = 2.4;     // sharpness tolerance
  const SIG_G  = 0.70;    // contrast tolerance
  const W_SHARP= 0.82, W_TONE=0.18;

  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  function build(body, ctx) {
    body.innerHTML = `
      <div class="sem">
        <div class="stage">
          <svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice">
            <defs>
              <filter id="psf" x="-40%" y="-40%" width="180%" height="180%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="linearRGB">
                <feGaussianBlur in="SourceGraphic" stdDeviation="0 0" id="blur" result="b"/>
                <feComponentTransfer in="b">
                  <feFuncR type="linear" slope="1" intercept="0" class="tf"/>
                  <feFuncG type="linear" slope="1" intercept="0" class="tf"/>
                  <feFuncB type="linear" slope="1" intercept="0" class="tf"/>
                </feComponentTransfer>
              </filter>
              <radialGradient id="vig" cx="50%" cy="50%" r="62%">
                <stop offset="70%" stop-color="#000" stop-opacity="0"/>
                <stop offset="100%" stop-color="#000" stop-opacity="1"/>
              </radialGradient>
              <clipPath id="frame"><rect x="0" y="0" width="300" height="300"/></clipPath>
            </defs>
            <g clip-path="url(#frame)">
              <!-- the filter frame turns to the astigmatism axis; the content counter-turns -->
              <g id="rotA"><g filter="url(#psf)"><g id="rotC"><g id="scene"></g></g></g></g>
              <rect x="0" y="0" width="300" height="300" fill="url(#vig)"/>
            </g>
          </svg>
          <div class="scanlines"></div>
          <div class="hud">
            <div class="tl">SEI&nbsp;&nbsp;15.0kV</div>
            <div class="tr">TARGET</div>
            <div class="bl">WD&nbsp;10.0mm</div>
            <div class="br">x25,000</div>
          </div>
        </div>

        <div class="qwrap"><span>IMG&nbsp;QUALITY</span>
          <div class="qbar"><div class="qfill" id="qfill"></div></div><span id="qpct">0%</span></div>

        <div class="console">
          <div class="row"><span class="lab">Focus</span>
            <input type="range" id="focus" min="-100" max="100" value="0" step="1"><span class="val" id="focusV">0</span></div>
          <div class="stig">
            <div class="pad" id="pad"><div class="cross cx"></div><div class="cross cy"></div><div class="dot" id="padDot"></div></div>
            <div class="side">
              <div class="lab">Stigmator</div>
              <div>X&nbsp;<span class="v" id="stigXV">0</span></div>
              <div>Y&nbsp;<span class="v" id="stigYV">0</span></div>
              <div style="color:#7a838b;margin-top:4px;line-height:1.4">drag pad to<br>correct astig.</div>
            </div>
          </div>
          <div class="row"><span class="lab">Contrast</span>
            <input type="range" id="contrast" min="20" max="320" value="100" step="1"><span class="val" id="contrastV">1.00</span></div>
          <div class="row"><span class="lab">Bright</span>
            <input type="range" id="bright" min="-100" max="100" value="0" step="1"><span class="val" id="brightV">0</span></div>
        </div>

        <div class="actions">
          <button class="capture" id="captureBtn">Capture!</button>
          <button class="skip" id="skipBtn">New<br>Sample</button>
        </div>
      </div>`;

    const $ = id => body.querySelector('#' + id);
    const scene = $('scene'), rotA = $('rotA'), rotC = $('rotC'), blur = $('blur');
    const tfs = [...body.querySelectorAll('.tf')];
    const focusEl = $('focus'), contrastEl = $('contrast'), brightEl = $('bright');
    const pad = $('pad'), padDot = $('padDot');

    const S = { focus:0, stigX:0, stigY:0, contrast:1, bright:0, f0:0, aX:0, aY:0, g0:1 };
    // The SVG filter is the expensive part on phones, so the image is redrawn
    // only when a control or the sample has changed.
    let dirty = true;

    // ---- sample ----
    // Content is drawn compressed into the native window [lo,hi]; the right
    // contrast stretches it back to full range.
    function buildScene(glyph, lo, hi) {
      const cx = 150, cy = 150, span = hi - lo;
      const map = v => Math.round(255 * (lo + clamp(v, 0, 1) * span));
      const rgb = v => { const x = map(v); return `rgb(${x},${x},${x})`; };
      let bars = '';
      for (let i = 0; i < 9; i++) {
        const v = map(i / 8), x = 30 + i * (240 / 9);
        bars += `<rect x="${x.toFixed(1)}" y="258" width="${(240/9-2).toFixed(1)}" height="20" fill="rgb(${v},${v},${v})"/>`;
      }
      let grain = '';
      for (let i = 0; i < 140; i++) {
        grain += `<circle cx="${(Math.random()*420-60).toFixed(1)}" cy="${(Math.random()*420-60).toFixed(1)}" r="${(Math.random()*1.6+0.4).toFixed(2)}" fill="${rgb(0.47+Math.random()*0.35)}" opacity="0.5"/>`;
      }
      let contam = '';
      const clusters = 2 + Math.floor(Math.random() * 3);
      for (let c = 0; c < clusters; c++) {
        const onGlyph = Math.random() < 0.45;
        const ccx = onGlyph ? cx + (Math.random()*120-60) : 30 + Math.random()*240;
        const ccy = onGlyph ? cy + (Math.random()*120-60) : 30 + Math.random()*240;
        const dots = 5 + Math.floor(Math.random() * 7);
        for (let d = 0; d < dots; d++) {
          const dx = ccx + (Math.random()*2-1)*16*Math.sqrt(-2*Math.log(Math.random()+1e-6))*0.4;
          const dy = ccy + (Math.random()*2-1)*16*Math.sqrt(-2*Math.log(Math.random()+1e-6))*0.4;
          contam += `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${(Math.random()*2.6+1).toFixed(2)}" fill="${rgb(0.03+Math.random()*0.16)}" opacity="${(0.28+Math.random()*0.32).toFixed(2)}"/>`;
        }
      }
      const ga = Math.random() * Math.PI;
      const x1 = (50-Math.cos(ga)*50).toFixed(1), y1 = (50-Math.sin(ga)*50).toFixed(1);
      const x2 = (50+Math.cos(ga)*50).toFixed(1), y2 = (50+Math.sin(ga)*50).toFixed(1);
      const gHi = 0.94 + Math.random()*0.06, gLo = 0.42 + Math.random()*0.13;
      let marks = '';
      const mk = (v, rmin, rmax) => {
        const ang = Math.random()*Math.PI*2, rad = 52 + Math.random()*62;
        return `<circle cx="${(cx+Math.cos(ang)*rad).toFixed(1)}" cy="${(cy+Math.sin(ang)*rad).toFixed(1)}" r="${(rmin+Math.random()*(rmax-rmin)).toFixed(2)}" fill="${rgb(v)}"/>`;
      };
      for (let i = 0; i < 3; i++) marks += mk(0.97 + Math.random()*0.03, 2.6, 5.4);
      for (let i = 0; i < 3; i++) marks += mk(Math.random()*0.04, 3.0, 6.8);
      const bgA = rgb(0.05 + Math.random()*0.05), bgB = rgb(0.10 + Math.random()*0.06);
      scene.innerHTML = `
        <defs>
          <linearGradient id="glyphGrad" x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%">
            <stop offset="0%" stop-color="${rgb(gHi)}"/><stop offset="100%" stop-color="${rgb(gLo)}"/>
          </linearGradient>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="${bgA}"/><stop offset="100%" stop-color="${bgB}"/>
          </linearGradient>
        </defs>
        <rect x="-90" y="-90" width="480" height="480" fill="url(#bgGrad)"/>
        <g>${grain}</g>
        <circle cx="${cx}" cy="${cy}" r="96" fill="none" stroke="${rgb(0.22)}" stroke-width="2"/>
        <g>${marks}</g>
        <text x="${cx}" y="${cy+58}" font-family="Georgia, 'Times New Roman', serif"
              font-size="170" font-weight="700" text-anchor="middle" fill="url(#glyphGrad)">${glyph}</text>
        <g>${contam}</g>
        <g opacity="0.9">${bars}</g>`;
    }

    function newSample() {
      const span = 0.60 + Math.random()*0.20;
      const mid = 0.5 + (Math.random()*2-1) * 0.26*span;
      const lo = Math.max(0.03, mid - span/2), hi = Math.min(0.97, mid + span/2);
      buildScene(GLYPHS[Math.floor(Math.random()*GLYPHS.length)], lo, hi);
      S.g0 = 1 / (hi - lo);
      S.f0 = (Math.random()*2-1) * F_MAX * 0.7;
      const aMag = A_MAX * (0.45 + Math.random()*0.55), aAng = Math.random()*Math.PI*2;
      S.aX = Math.cos(aAng) * aMag; S.aY = Math.sin(aAng) * aMag;
      // Every sample starts deliberately detuned.
      S.focus = clamp(S.f0 + (Math.random()*2-1)*45, -100, 100);
      S.stigX = clamp(-S.aX + (Math.random()*2-1)*35, -100, 100);
      S.stigY = clamp(-S.aY + (Math.random()*2-1)*35, -100, 100);
      S.contrast = 1.0; S.bright = 0;
      syncControls();
      dirty = true;
    }

    // ---- optics ----
    function blurs() {
      const D = S.focus - S.f0;
      const rx = S.aX + S.stigX, ry = S.aY + S.stigY;
      const a = Math.hypot(rx, ry) * 0.5;
      return {
        s1: Math.max(S_MIN, K_BLUR * Math.abs(D - a)),
        s2: Math.max(S_MIN, K_BLUR * Math.abs(D + a)),
        theta: Math.atan2(ry, rx) * 0.5,
      };
    }
    function render() {
      const { s1, s2, theta } = blurs();
      const deg = theta * 180 / Math.PI;
      rotA.setAttribute('transform', `rotate(${deg.toFixed(2)} 150 150)`);
      rotC.setAttribute('transform', `rotate(${(-deg).toFixed(2)} 150 150)`);
      blur.setAttribute('stdDeviation', `${s1.toFixed(3)} ${s2.toFixed(3)}`);
      const g = S.contrast, off = S.bright/255 + 0.5 - g*0.5;
      tfs.forEach(f => { f.setAttribute('slope', g.toFixed(3)); f.setAttribute('intercept', off.toFixed(3)); });
    }
    // Brightness is deliberately absent: it helps the eye, not the score.
    function quality() {
      const { s1, s2 } = blurs();
      const sharp = Math.exp(-(s1*s1 + s2*s2) / (2*SIG_S*SIG_S));
      const tone = Math.exp(-((S.contrast-S.g0)**2) / (2*SIG_G*SIG_G));
      return clamp(W_SHARP*sharp + W_TONE*tone, 0, 1);
    }

    // ---- controls ----
    function setPad(x, y) {
      padDot.style.left = (50 + x/100*46) + '%';
      padDot.style.top  = (50 - y/100*46) + '%';
    }
    function syncControls() {
      focusEl.value = Math.round(S.focus);
      contrastEl.value = Math.round(S.contrast * 100);
      brightEl.value = Math.round(S.bright);
      $('focusV').textContent = Math.round(S.focus);
      $('contrastV').textContent = S.contrast.toFixed(2);
      $('brightV').textContent = Math.round(S.bright);
      setPad(S.stigX, S.stigY);
      $('stigXV').textContent = Math.round(S.stigX);
      $('stigYV').textContent = Math.round(S.stigY);
    }
    function padFromEvent(e) {
      const r = pad.getBoundingClientRect();
      S.stigX = clamp((e.clientX - r.left - r.width/2) / (r.width/2) * 100, -100, 100);
      S.stigY = clamp(-(e.clientY - r.top - r.height/2) / (r.height/2) * 100, -100, 100);
      setPad(S.stigX, S.stigY);
      $('stigXV').textContent = Math.round(S.stigX);
      $('stigYV').textContent = Math.round(S.stigY);
      dirty = true;
    }
    let dragging = false;
    pad.addEventListener('pointerdown', e => { dragging = true; pad.setPointerCapture(e.pointerId); padFromEvent(e); });
    pad.addEventListener('pointermove', e => { if (dragging) padFromEvent(e); });
    pad.addEventListener('pointerup', () => { dragging = false; });
    pad.addEventListener('pointercancel', () => { dragging = false; });

    focusEl.addEventListener('input', e => { S.focus = +e.target.value; $('focusV').textContent = S.focus; dirty = true; });
    contrastEl.addEventListener('input', e => { S.contrast = e.target.value/100; $('contrastV').textContent = S.contrast.toFixed(2); dirty = true; });
    brightEl.addEventListener('input', e => { S.bright = +e.target.value; $('brightV').textContent = S.bright; dirty = true; });

    $('captureBtn').addEventListener('click', () => {
      if (!ctx.running) return;
      ctx.judge(quality());
      if (ctx.running) newSample();
    });
    $('skipBtn').addEventListener('click', () => { if (ctx.running) newSample(); });

    // Something to look at behind the start screen.
    buildScene('あ', 0.12, 0.62);

    return {
      start() { newSample(); },
      tick() {
        if (!dirty) return;
        dirty = false;
        render();
        const q = quality();
        $('qfill').style.width = (q*100).toFixed(1) + '%';
        $('qpct').textContent = Math.round(q*100) + '%';
      },
    };
  }

  MG.mount(document.getElementById('mg'), {
    id: 'sem',
    title: 'SEM',
    subtitle: 'Focus & Stigmator',
    desc: 'フォーカスとスティグマで像を鋭くして Capture。コントラストも像質に効く。明るさは見やすさのためで、評価には影響しない。',
    timeLimit: 60,
    goal: 3,
    build,
  });
})();
</script>
</body>
</html>
